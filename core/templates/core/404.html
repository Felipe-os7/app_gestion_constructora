<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página no encontrada · Gestión de Cuadrillas</title>
  <style>
    :root { --bg:#f6f8fb; --card:#ffffff; --text:#1f2d3d; --muted:#5b6b7c; --brand:#0b3350; --brand-text:#ffffff; --line:#e3e8ef; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f1720; --card:#17212c; --text:#e8eef5; --muted:#9db0c3; --brand:#4aa3df; --brand-text:#08202f; --line:#26364a; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; padding: 24px;
           background: var(--bg); color: var(--text);
           font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { width: 100%; max-width: 480px; text-align: center; padding: 40px 32px;
            background: var(--card); border: 1px solid var(--line); border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, .06); }
    .code { margin: 0; font-size: 72px; font-weight: 800; line-height: 1; color: var(--brand); letter-spacing: -2px; }
    h1 { margin: 16px 0 8px; font-size: 22px; }
    p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a.btn { display: inline-block; padding: 10px 18px; border-radius: 8px; font-size: 15px; font-weight: 600; text-decoration: none; }
    a.primary { background: var(--brand); color: var(--brand-text); }
    a.secondary { border: 1px solid var(--line); color: var(--text); }
    a.btn:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <p class="code" aria-hidden="true">404</p>
    <h1>Página no encontrada</h1>
    <p>La dirección que buscas no existe o fue movida. Revisa que esté bien escrita o vuelve al inicio.</p>
    <div class="actions">
      <a class="btn primary" href="/">Ir al inicio</a>
      <a class="btn secondary" href="/cuadrilla/">Ver cuadrillas</a>
    </div>
  </main>
</body>
</html>
