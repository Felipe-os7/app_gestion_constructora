{% extends "core/base.html" %}

{% block title %}Editar Cuadrilla{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>Editar Cuadrilla</h2>
  <a href="{% url 'cuadrilla' %}" class="btn btn-secondary">Volver</a>
</div>

<form method="post" id="form-cuadrilla" class="row g-3">
  {% csrf_token %}
  <div class="col-md-6">
    <label for="nombre" class="form-label">Nombre</label>
    <input id="nombre" name="nombre" class="form-control" value="{{ cuadrilla.nombre }}" required>
  </div>
  <div class="col-md-6">
    <label for="proyecto" class="form-label">Proyecto</label>
    <select id="proyecto" name="proyecto" class="form-select" required>
      {% for proyecto in proyectos %}
      <option value="{{ proyecto.codigo }}" {% if proyecto.codigo == cuadrilla.proyecto_id %}selected{% endif %}>
        {{ proyecto.nombre }}
      </option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-6">
    <label for="estado" class="form-label">Estado</label>
    <select id="estado" name="estado" class="form-select" required>
      {% for valor, etiqueta in cuadrilla.ESTADO_CHOICES %}
      <option value="{{ valor }}" {% if cuadrilla.estado == valor %}selected{% endif %}>{{ etiqueta }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-4">
    <label for="fecha_inicio_jornada" class="form-label">Primer día de jornada</label>
    <input id="fecha_inicio_jornada" type="date" name="fecha_inicio_jornada" class="form-control"
           value="{{ cuadrilla.fecha_inicio_jornada|date:'Y-m-d' }}">
  </div>
  <div class="col-md-4">
    <label for="fecha_fin_jornada" class="form-label">Último día de jornada</label>
    <input id="fecha_fin_jornada" type="date" name="fecha_fin_jornada" class="form-control"
           value="{{ cuadrilla.fecha_fin_jornada|date:'Y-m-d' }}">
  </div>
  <div class="col-md-4">
    <label for="horas_diarias" class="form-label">Horas diarias</label>
    <input id="horas_diarias" type="number" name="horas_diarias" class="form-control"
           min="1" max="8" step="0.25" value="{{ cuadrilla.horas_diarias|default_if_none:'' }}">
  </div>

  <div class="col-12">
    <h3 class="h5">Integrantes</h3>
    <div class="list-group">
      {% for integrante in integrantes_disponibles %}
      <label class="list-group-item">
        <input class="form-check-input me-2" type="checkbox" name="integrantes"
               value="{{ integrante.id }}"
               {% if integrante.cuadrilla_id == cuadrilla.id %}checked{% endif %}>
        {{ integrante.nombre }} — {{ integrante.get_cargo_display }}
        <input type="hidden" name="rol_{{ integrante.id }}" value="{{ integrante.cargo }}">
        <input type="hidden" name="estado_{{ integrante.id }}" value="{{ integrante.estado }}">
      </label>
      {% empty %}
      <p class="text-muted">No hay trabajadores disponibles.</p>
      {% endfor %}
    </div>
  </div>

  <div class="col-12">
    <button type="submit" class="btn btn-primary">Guardar cambios</button>
    <a href="{% url 'cuadrilla' %}" class="btn btn-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
