trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-24.04'

variables:
  PYTHON_VERSION: '3.13'
  DJANGO_SETTINGS_MODULE: 'app_gestion.settings'
  MYSQL_DATABASE: 'test_appgestion'
  MYSQL_USER: 'app_user'
  MYSQL_PASSWORD: 'app_secure_password'
  MYSQL_ROOT_PASSWORD: 'root_secure_password'

stages:
# ==========================================
# STAGE 1: INTEGRACIÓN CONTINUA (CI)
# ==========================================
- stage: CI_Build_and_Test
  displayName: 'Integración Continua: Build, Lint y Pruebas'
  jobs:
  - job: TestAndSecurity
    displayName: 'Pruebas Unitarias y DevSecOps'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: $(PYTHON_VERSION)
      displayName: 'Configurar entorno con Python $(PYTHON_VERSION)'

    - script: |
        sudo apt-get update
        sudo apt-get install -y default-libmysqlclient-dev pkg-config
      displayName: 'Instalar dependencias del sistema para mysqlclient'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest pytest-django
      displayName: 'Instalar librerías del proyecto'

    - script: |
        docker run --name mysql-ci \
          --env MYSQL_DATABASE="$(MYSQL_DATABASE)" \
          --env MYSQL_USER="$(MYSQL_USER)" \
          --env MYSQL_PASSWORD="$(MYSQL_PASSWORD)" \
          --env MYSQL_ROOT_PASSWORD="$(MYSQL_ROOT_PASSWORD)" \
          --publish 3306:3306 \
          --detach mysql:8.0

        for attempt in {1..60}; do
          if docker exec mysql-ci mysqladmin ping --host=localhost \
            --user=root --password="$(MYSQL_ROOT_PASSWORD)" --silent; then
            exit 0
          fi
          sleep 2
        done

        echo 'MySQL no estuvo disponible a tiempo.'
        docker logs mysql-ci
        exit 1
      displayName: 'Iniciar y esperar MySQL para las pruebas'

    - script: |
        # Verificación de sintaxis y código limpio
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      displayName: 'Linting de código con Flake8'

    - script: |
        python manage.py migrate --noinput
        pytest --junitxml="$(Common.TestResultsDirectory)/pytest-results.xml"
      env:
        DJANGO_SETTINGS_MODULE: $(DJANGO_SETTINGS_MODULE)
        DJANGO_DEBUG: 'False'
        DJANGO_SECRET_KEY: 'clave-insegura-solo-para-pruebas-ci'
        DB_NAME: $(MYSQL_DATABASE)
        DB_USER: $(MYSQL_USER)
        DB_PASSWORD: $(MYSQL_PASSWORD)
        DB_HOST: 127.0.0.1
        DB_PORT: '3306'
      displayName: 'Ejecutar suite de pruebas (pytest)'

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(Common.TestResultsDirectory)/pytest-results.xml'
        failTaskOnFailedTests: true
      displayName: 'Publicar resultados de pytest'

    - script: docker rm -f mysql-ci
      condition: always()
      displayName: 'Limpiar contenedor MySQL de CI'

# ==========================================
# STAGE 2: DESPLIEGUE CONTINUO (CD)
# ==========================================
- stage: CD_Deploy_Production
  displayName: 'Despliegue a Producción'
  dependsOn: CI_Build_and_Test
  # Solo se ejecuta si pasó la fase CI y si el commit proviene de la rama 'main'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployApp
    displayName: 'Desplegar a Servidor Productivo'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              set -e
              case "$RENDER_DEPLOY_HOOK_URL" in
                ''|'$('*')
                  echo 'Falta configurar la variable secreta RENDER_DEPLOY_HOOK_URL.'
                  exit 1
                  ;;
              esac
              curl --fail --silent --show-error \
                --request POST "$RENDER_DEPLOY_HOOK_URL"
            env:
              RENDER_DEPLOY_HOOK_URL: $(RENDER_DEPLOY_HOOK_URL)
            displayName: 'Disparar despliegue en Render'